# Publishes to PyPI when the version in pyproject.toml changes on main. Run it manually to publish
# the current version again, for example after a failed publish.
name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for this project is limited to this environment.
    environment: pypi
    permissions:
      contents: write # Required to create the GitHub release
      id-token: write # Required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check if the version changed
        run: |
          version() { python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'; }
          VERSION=$(version < pyproject.toml)
          OLD_VERSION=$(git show HEAD~1:pyproject.toml | version)
          CHANGED=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$OLD_VERSION" != "$VERSION" ]; then
            CHANGED=true
          fi
          echo "Version $OLD_VERSION -> $VERSION, publish: $CHANGED"
          {
            echo "CHANGED=$CHANGED"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.CHANGED == 'true'
        with:
          python-version: "3.12"
      - if: env.CHANGED == 'true'
        run: pip install . "litellm[proxy]" build==1.6.1
      - if: env.CHANGED == 'true'
        run: python -m unittest discover -s tests -v
      - if: env.CHANGED == 'true'
        run: python -m build
      - name: Create GitHub release
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/*
      - if: env.CHANGED == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
