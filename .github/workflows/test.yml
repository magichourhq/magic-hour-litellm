name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.litellm }} litellm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest LiteLLM pyproject.toml allows, and the newest.
        litellm: [oldest, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The proxy hook tests need LiteLLM's proxy extras.
      - run: pip install . "litellm[proxy]"
      - if: matrix.litellm == 'oldest'
        run: pip install "litellm[proxy]==1.106.3"
      - run: pip show litellm
      - run: python -m unittest discover -s tests -v
