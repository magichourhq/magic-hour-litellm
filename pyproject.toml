[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-hour-litellm"
version = "0.1.1"
description = "Magic Hour image generation through LiteLLM's CustomLLM interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Magic Hour"}]
dependencies = ["litellm>=1.82,<2", "httpx>=0.28.1,<1"]

[project.urls]
Homepage = "https://magichour.ai"
Repository = "https://github.com/magichourhq/magic-hour-litellm"
Issues = "https://github.com/magichourhq/magic-hour-litellm/issues"

[tool.setuptools.packages.find]
where = ["src"]
